[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggr-eval"
version = "0.1.0"
requires-python = ">=3.10"
description = "Minimal benchmark evaluation for GGR"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["ggr_eval*"]

[tool.setuptools.package-data]
"ggr_eval" = ["datasets.json"]
"ggr_eval.scorers" = ["*.txt", "*.jinja", "chartqa_pro_prompts_alt/*.txt"]
