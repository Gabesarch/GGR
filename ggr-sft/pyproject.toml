[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llamafactory"
version = "0.1.0"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llamafactory*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "version/version"]
