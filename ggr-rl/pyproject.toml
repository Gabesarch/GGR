[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verl"
version = "0.1.0"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["."]
include = ["verl*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "version/version"]
